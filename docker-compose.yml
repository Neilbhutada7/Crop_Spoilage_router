version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: spoilage_router_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spoilage_router
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spoilage_router_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/spoilage_router
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/venv # exclude virtual env from volume mount

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spoilage_router_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # exclude node modules

volumes:
  db_data:
