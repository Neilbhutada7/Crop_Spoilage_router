version: '3.8'

# Finalized stack (see README.md "Technology Stack"): Flask + SQLite backend,
# React/Vite frontend. There is no Postgres service here — the backend only
# ever talks to SQLite (backend/spoilage_router.db) via sqlite3. An earlier
# iteration of this project provisioned a Postgres/PostGIS service and
# db/init.sql that the code never actually used; it has been removed from
# this file to keep the deployed stack honest about what's real. db/init.sql
# is kept in the repo for reference in case a future Postgres migration
# happens, but it is not wired into any running service today.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spoilage_router_backend
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/venv # exclude virtual env from volume mount

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spoilage_router_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules # exclude node modules
